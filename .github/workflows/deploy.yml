name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The deploy job needs these; the build job does not.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck (client and server)
        run: npm run typecheck

      - name: Build
        env:
          # Serves the site from https://<owner>.github.io/<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/
          # OPTIONAL. Set this repository variable to the origin of a deployed
          # proxy that holds the API key (see worker/README.md). Leave it unset
          # and the site asks each visitor for their own key instead.
          #
          # Do NOT put an API key here or in any other build-time variable: a
          # static site cannot keep a secret, and anything the browser needs at
          # runtime ends up readable in the published bundle.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: npm run build

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

name: Drawing tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/test-scope.yml

  drawing:
    needs: changes
    if: needs.changes.outputs.rendering == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [drawing-pixels, drawing-sweeps]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:browser:install -- --with-deps
      - run: npm run test:${{ matrix.suite }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.suite }}-evidence
          path: |
            work/drawing-investigation/
            work/hypotheses/extended/
